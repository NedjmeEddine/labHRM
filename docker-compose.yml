services:
  web:
    build: .
    container_name: el_ame_lab_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database file on host disk
      - ./data:/app/backend/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-replace-with-a-secure-random-key-in-prod}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@elamel-lab.dz}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-ElAmelLab2026!}
      - PROJECT_NAME=EL-AMEL LAB
