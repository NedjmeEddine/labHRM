name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
          - platform: 'windows-latest'
            args: '--bundles msi,nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      - name: Build frontend
        run: |
          cd frontend
          bun install
          bun run build

      - name: Build PyInstaller sidecar (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          chmod +x scripts/build-sidecar.sh
          ./scripts/build-sidecar.sh

      - name: Build PyInstaller sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cd backend
          uv sync
          uv run pyinstaller --clean backend.spec
          New-Item -ItemType Directory -Force -Path ..\frontend\src-tauri\binaries
          Copy-Item dist\el-amel-backend.exe ..\frontend\src-tauri\binaries\el-amel-backend-x86_64-pc-windows-msvc.exe

      - name: Build and release Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: "./frontend"
          tagName: ${{ github.ref_name }}
          releaseName: "EL-AMEL LAB ${{ github.ref_name }}"
          releaseBody: "Consultez les notes de version pour la version ${{ github.ref_name }}."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
