name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.3)'
        required: true
        default: 'v1.0.3'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build frontend
        run: |
          cd frontend
          bun install
          bun run build

      - name: Build PyInstaller sidecar (Windows)
        shell: pwsh
        run: |
          cd backend
          uv sync
          uv run pyinstaller --clean backend.spec
          New-Item -ItemType Directory -Force -Path ..\frontend\src-tauri\binaries
          Copy-Item dist\el-amel-backend.exe ..\frontend\src-tauri\binaries\el-amel-backend-x86_64-pc-windows-msvc.exe

      - name: Build and release Tauri application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: "./frontend"
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "EL-AMEL LAB ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "Consultez les notes de version pour la version ${{ github.event.inputs.tag || github.ref_name }}."
          releaseDraft: false
          prerelease: false
          args: "--bundles msi,nsis"
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
