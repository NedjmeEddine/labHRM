[package]
name = "app"
version = "1.0.3"
description = "EL-AMEL LAB - Gestion RH & Stocks"
authors = ["NedjmeEddine <https://github.com/NedjmeEddine>"]
license = "Proprietary"
repository = "https://github.com/NedjmeEddine/labHRM"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.6.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.1"
