[project]
name = "app"
version = "0.1.0"
description = "EL AME LAB - Single-User Management App"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.7.0",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.2.1",
    "pyjwt>=2.8.0",
    "pwdlib[argon2,bcrypt]>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"
